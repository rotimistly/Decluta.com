<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<title>Decluta Admin</title>
<style>
:root{--bg:#F6F7F4;--surface:#fff;--ink:#15201A;--muted:#58665D;--line:#DCE1DA;--green:#0E6B3F;--yellow:#FFC20E;--red:#C0341D;--blue:#1D6FE0;--font:'Segoe UI',system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0F1511;--surface:#17201A;--ink:#EDF2EE;--muted:#9BAAA0;--line:#2A362E;--green:#23895A;--red:#FF8A75}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px;background:var(--green);color:#fff}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.ink{background:#15201A;color:#fff}
.field{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 4px}
.hint{color:var(--muted);font-size:14px;margin:4px 0}
.err{color:var(--red);font-size:14px;min-height:1.2em;margin:6px 0 0}
.gate{max-width:420px;margin:12vh auto 0;padding:24px 18px}
.gate h1{font-size:26px;margin:0 0 6px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#15201A;color:#fff;position:sticky;top:0;z-index:5}
.bar strong{font-size:18px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--yellow);color:#15201A}
.bar .sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1.5px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:17px;margin:18px 0 6px}
.notice{border-radius:10px;padding:10px 14px;margin:0 0 14px;background:color-mix(in srgb,var(--yellow) 25%,var(--surface));font-size:15px}
.notice.warn{background:color-mix(in srgb,var(--red) 14%,var(--surface))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.card span{display:block;color:var(--muted);font-size:13px}
.card strong{font-size:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters .field{flex:1;min-width:130px}
.tbl{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:none;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--ink)}
.pill.ok{background:color-mix(in srgb,var(--green) 22%,var(--surface))}
.pill.bad{background:color-mix(in srgb,var(--red) 22%,var(--surface))}
.pill.warn{background:color-mix(in srgb,var(--yellow) 45%,var(--surface))}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
a{color:var(--ink)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 10px 4px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
.chart small{font-size:10px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.hbar b{display:block;height:10px;background:var(--green);border-radius:5px}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100% - 20px));max-height:calc(100% - 20px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,12,.6)}
.dlg{padding:18px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:transparent;color:var(--ink);font-size:28px;width:44px;height:44px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:15px}
.kv span{color:var(--muted)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{max-width:100%;max-height:70vh;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#15201A;color:#fff;padding:12px 18px;border-radius:10px;max-width:calc(100% - 32px);z-index:50;font-weight:600}
.toast[hidden]{display:none}
[hidden]{display:none!important}
textarea.field{min-height:100px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;margin:10px 0;padding:4px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:15px;word-break:break-word}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff}
.msg.them{align-self:flex-start;background:var(--bg);border:1.5px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<noscript>Please turn on JavaScript to use the admin page.</noscript>

<div class="gate" id="gate" hidden>
  <h1 id="gateTitle">Admin sign in</h1>
  <p class="hint" id="gateText"></p>
  <form id="gateForm" novalidate>
    <label for="pass">Passcode</label>
    <input class="field" id="pass" type="password" autocomplete="current-password">
    <div id="pass2Wrap"><label for="pass2">Repeat passcode</label><input class="field" id="pass2" type="password" autocomplete="new-password"></div>
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn" type="submit" style="width:100%;margin-top:6px">Continue</button>
  </form>
  <p class="hint" style="margin-top:16px">This page is private to you. It is not linked from the public website.</p>
</div>

<div id="app" hidden>
  <header class="bar"><strong>Decluta Admin</strong><span class="badge" id="srcBadge"></span><span class="sp"></span><input class="field" id="gs" placeholder="Search anything" aria-label="Search anything" style="max-width:190px;min-height:36px;padding:4px 10px"><button class="btn line sm" id="lockBtn" type="button" style="color:#fff;border-color:#5a6a60">Lock</button></header>
  <nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
  <main id="view"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>if(self!==top&&/(^|\.)github\.io$|^(www\.)?decluta\.com$/.test(location.hostname)){document.documentElement.innerHTML="";}</script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
var SCRIPT_TEXT="// Decluta.com cloud record + support messages (Google Apps Script)\n// 1. Change ADMIN_KEY below to a long secret (at least 16 letters and numbers) that only you know.\n// 2. Deploy as a Web app: Execute as \"Me\", Who has access \"Anyone\".\n// 3. After you change this code later, choose Deploy > Manage deployments > Edit > New version.\n\nconst ADMIN_KEY = \"CHANGE_ME_TO_A_LONG_SECRET\";\n\nconst SHEETS = {\n  users: [\"device\",\"id\",\"name\",\"phone\",\"role\",\"verified\",\"idType\",\"idHash\",\"joined\",\"status\",\"deleteAt\",\"credit\",\"purchases\",\"sales\",\"updatedAt\"],\n  listings: [\"device\",\"id\",\"title\",\"cat\",\"state\",\"area\",\"price\",\"kind\",\"seller\",\"owner\",\"sold\",\"hidden\",\"photoStatus\",\"photos\",\"when\",\"updatedAt\"],\n  wanted: [\"device\",\"id\",\"title\",\"cat\",\"state\",\"budget\",\"owner\",\"found\",\"hasPhoto\",\"updatedAt\"],\n  deals: [\"device\",\"id\",\"title\",\"price\",\"fee\",\"commission\",\"buyer\",\"seller\",\"method\",\"when\",\"updatedAt\"],\n  reports: [\"device\",\"id\",\"reason\",\"by\",\"when\",\"updatedAt\"],\n  reviews: [\"device\",\"seller\",\"stars\",\"text\",\"by\",\"updatedAt\"]\n};\nconst SUPPORT_COLS = [\"id\",\"device\",\"uid\",\"from\",\"name\",\"text\",\"when\"];\n\n// Safety limits so strangers cannot flood your sheet.\nconst CAPS = { users: 100, listings: 500, wanted: 300, deals: 500, reports: 200, reviews: 300 };\nconst MAX_BODY = 300000;        // largest message the website may send\nconst MAX_SHEET_ROWS = 20000;   // stop writing when a sheet is this full\nconst DEVICE_RE = /^D[a-z0-9-]{6,40}$/i;\nconst UID_RE = /^U[0-9]{3,8}$/;\nconst MID_RE = /^M[a-z0-9]{6,40}$/i;\n\nfunction clip_(v, n) { return String(v === undefined || v === null ? \"\" : v).slice(0, n); }\n\n// Stops text that starts with = + - @ from being treated as a formula.\nfunction safe_(v) {\n  const s = String(v === undefined || v === null ? \"\" : v);\n  return /^[=+\\-@]/.test(s) ? \"'\" + s : s;\n}\nfunction unsafe_(v) {\n  return typeof v === \"string\" ? v.replace(/^'([=+\\-@])/, \"$1\") : v;\n}\n\nfunction keyOk_() {\n  return ADMIN_KEY && ADMIN_KEY !== \"CHANGE_ME_TO_A_LONG_SECRET\" && ADMIN_KEY.length >= 16;\n}\n// Returns \"ok\", \"bad\", \"locked\" or \"weakkey\". Too many wrong keys pauses key checks for 10 minutes.\nfunction checkKey_(k) {\n  const cache = CacheService.getScriptCache();\n  const fails = Number(cache.get(\"keyfails\") || 0);\n  if (fails >= 20) return \"locked\";\n  if (!keyOk_()) return \"weakkey\";\n  if (k !== ADMIN_KEY) { cache.put(\"keyfails\", String(fails + 1), 600); return \"bad\"; }\n  return \"ok\";\n}\nfunction rateOk_(name, limit, secs) {\n  const c = CacheService.getScriptCache();\n  const n = Number(c.get(name) || 0);\n  if (n >= limit) return false;\n  c.put(name, String(n + 1), secs);\n  return true;\n}\n\nfunction sheetFor_(name, cols) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    sh.getRange(1, 1, sh.getMaxRows(), cols.length).setNumberFormat(\"@\"); // keep phone numbers as text\n    sh.appendRow(cols);\n    sh.setFrozenRows(1);\n  }\n  return sh;\n}\nfunction sheet_(name) { return sheetFor_(name, SHEETS[name]); }\nfunction supportSheet_() { return sheetFor_(\"support\", SUPPORT_COLS); }\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction appendSupport_(m) {\n  if (!DEVICE_RE.test(String(m.device)) || !UID_RE.test(String(m.uid)) || !MID_RE.test(String(m.id))) return false;\n  const text = clip_(m.text, 500).trim();\n  if (!text) return false;\n  const sh = supportSheet_();\n  const last = sh.getLastRow();\n  if (last > MAX_SHEET_ROWS) return false;\n  if (last > 1) {\n    const ids = sh.getRange(2, 1, last - 1, 1).getValues();\n    for (let i = 0; i < ids.length; i++) if (String(ids[i][0]) === String(m.id)) return true; // already stored\n  }\n  const rec = { id: m.id, device: m.device, uid: m.uid, from: m.from, name: clip_(m.name, 60), text: text, when: clip_(m.when, 20) };\n  const row = SUPPORT_COLS.map(function (c) { return safe_(clip_(rec[c], 500)); });\n  sh.getRange(sh.getLastRow() + 1, 1, 1, SUPPORT_COLS.length).setValues([row]);\n  return true;\n}\n\nfunction readSupport_() {\n  const v = supportSheet_().getDataRange().getValues();\n  v.shift();\n  return v.map(function (r) {\n    const o = {};\n    SUPPORT_COLS.forEach(function (k, i) { o[k] = unsafe_(r[i]); });\n    return o;\n  });\n}\n\n// The website sends either a snapshot of what one browser holds, or a support message.\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    if (!e || !e.postData || !e.postData.contents || e.postData.contents.length > MAX_BODY) return out_({ ok: false });\n    let d;\n    try { d = JSON.parse(e.postData.contents); } catch (x) { return out_({ ok: false }); }\n    if (!d || typeof d !== \"object\" || !DEVICE_RE.test(String(d.device || \"\"))) return out_({ ok: false });\n\n    if (d.type === \"support\") {\n      if (d.from !== \"user\") return out_({ ok: false });\n      if (!rateOk_(\"sup:\" + d.device, 30, 3600)) return out_({ ok: false, error: \"slow down\" });\n      return out_({ ok: appendSupport_({ id: d.id, device: d.device, uid: d.uid, from: \"user\", name: d.name, text: d.text, when: d.when }) });\n    }\n\n    if (!rateOk_(\"snap:\" + d.device, 60, 3600)) return out_({ ok: false, error: \"slow down\" });\n    const now = new Date().toISOString();\n    Object.keys(SHEETS).forEach(function (name) {\n      const sh = sheet_(name), cols = SHEETS[name];\n      const last = sh.getLastRow();\n      if (last > 1) {\n        const devs = sh.getRange(2, 1, last - 1, 1).getValues();\n        for (let i = devs.length - 1; i >= 0; i--) {\n          if (devs[i][0] === d.device) sh.deleteRow(i + 2);\n        }\n      }\n      if (sh.getLastRow() > MAX_SHEET_ROWS) return;\n      const src = Array.isArray(d[name]) ? d[name].slice(0, CAPS[name]) : [];\n      const rows = src.map(function (r) {\n        r = r && typeof r === \"object\" ? r : {};\n        return cols.map(function (c) {\n          if (c === \"device\") return d.device;\n          if (c === \"updatedAt\") return now;\n          return safe_(clip_(r[c], 200));\n        });\n      });\n      if (rows.length) sh.getRange(sh.getLastRow() + 1, 1, rows.length, cols.length).setValues(rows);\n    });\n    return out_({ ok: true });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction read_(name) {\n  const v = sheet_(name).getDataRange().getValues();\n  const h = v.shift();\n  return v.map(function (r) {\n    const o = {};\n    h.forEach(function (k, i) { o[k] = unsafe_(r[i]); });\n    return o;\n  });\n}\n\nfunction doGet(e) {\n  const p = (e && e.parameter) || {};\n  if (p.action === \"ping\") return out_({ ok: true });\n\n  // A visitor reads only the messages for their own browser and account.\n  if (p.action === \"inbox\") {\n    if (!DEVICE_RE.test(String(p.device || \"\")) || !UID_RE.test(String(p.uid || \"\"))) return out_({ ok: false });\n    if (!rateOk_(\"inbox:\" + p.device, 600, 3600)) return out_({ ok: false });\n    const msgs = readSupport_().filter(function (m) { return m.device === p.device && String(m.uid) === String(p.uid); });\n    return out_({ ok: true, messages: msgs.slice(-200) });\n  }\n\n  // Everything below needs your admin key.\n  const k = checkKey_(p.key);\n  if (k === \"locked\") return out_({ ok: false, error: \"locked, try again in 10 minutes\" });\n  if (k === \"weakkey\") return out_({ ok: false, error: \"set a stronger ADMIN_KEY in the script\" });\n  if (k !== \"ok\") return out_({ ok: false, error: \"bad key\" });\n\n  if (p.action === \"list\") {\n    const res = { ok: true };\n    Object.keys(SHEETS).forEach(function (n) { res[n] = read_(n); });\n    res.support = readSupport_();\n    return out_(res);\n  }\n  if (p.action === \"support_all\") return out_({ ok: true, support: readSupport_() });\n  if (p.action === \"send\") {\n    const lock = LockService.getScriptLock();\n    lock.waitLock(20000);\n    try {\n      const done = appendSupport_({ id: p.id, device: p.device, uid: p.uid, from: \"admin\", name: p.name || \"Decluta support\", text: p.text, when: Date.now() });\n      return out_({ ok: done });\n    } finally {\n      lock.releaseLock();\n    }\n  }\n  return out_({ ok: false });\n}\n";
var KEY="declutterng-v2",LOGKEY="dng-admin-log",AUTH="dng-admin-auth",CFG="dng-admin-cloud";
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){return "₦"+Number(n||0).toLocaleString("en-NG");}
function day(t){var d=new Date(t);return isNaN(d)?"":d.toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"});}
function intl(p){p=String(p||"").replace(/[^0-9]/g,"");return p.indexOf("234")===0?p:"234"+p.replace(/^0/,"");}
function getJSON(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function setJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
var CATS={phones:"Phones",electronics:"Electronics",furniture:"Furniture",home:"Home & kitchen",fashion:"Fashion",vehicles:"Vehicles",kids:"Kids",books:"Books"};
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},Math.max(2600,m.length*50));}
async function sha(s){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");}catch(e){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return "x"+h;}}

/* ---------- passcode gate ---------- */
var gateFails=0,gateLock=0;
function gerr(m){$("#gateErr").textContent=m;}
function showGate(){
  var a=getJSON(AUTH);
  $("#gate").hidden=false;$("#app").hidden=true;
  $("#gateTitle").textContent=a?"Admin sign in":"Create your admin passcode";
  $("#gateText").textContent=a?"Enter your admin passcode.":"Choose a passcode with at least 8 characters. You will use it each time you open this page.";
  $("#pass2Wrap").hidden=!!a;gerr("");$("#pass").value="";$("#pass2").value="";
}
$("#gateForm").addEventListener("submit",async function(e){
  e.preventDefault();
  var a=getJSON(AUTH),p=$("#pass").value;
  if(Date.now()<gateLock){gerr("Too many tries. Please wait a few minutes.");return;}
  if(!a){
    if(p.length<8){gerr("Use at least 8 characters.");return;}
    if(p!==$("#pass2").value){gerr("The two passcodes don't match.");return;}
    var salt=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function(x){return x.toString(16).padStart(2,"0");}).join("");
    setJSON(AUTH,{salt:salt,hash:await sha(salt+p)});
  }else if(await sha(a.salt+p)!==a.hash){
    gateFails++;if(gateFails>=5){gateLock=Date.now()+300000;gateFails=0;}
    gerr("Wrong passcode.");return;
  }
  gateFails=0;try{sessionStorage.setItem("dng-admin-ok","1");}catch(x){}
  enter();
});
$("#lockBtn").addEventListener("click",function(){try{sessionStorage.removeItem("dng-admin-ok");}catch(x){}showGate();});

/* ---------- data ---------- */
var D={users:[],listings:[],wanted:[],deals:[],reports:[],reviews:[],messages:[],removed:[],support:[]},SRC="local",RAW={},TAB="overview",Q={},FOUND=false;
var SUPKEY="declutterng-support",NOTESK="dng-admin-notes",SEENK="dng-admin-seen",CK=null,openChatKey=null;
var TABS=[["overview","Overview"],["users","Users"],["messages","Messages"],["listings","Listings"],["wanted","Wanted"],["reports","Reports"],["deals","Deals"],["reviews","Reviews"],["scan","Risk scan"],["deletions","Deletions"],["activity","Activity"],["data","Data & cloud"],["settings","Settings"]];

function uk(u){return (u.device?u.device+"|":"")+u.id;}
function ownerKey(x,f){return (x.device?x.device+"|":"")+x[f||"owner"];}
function userOf(x,f){var k=ownerKey(x,f);return D.users.find(function(u){return uk(u)===k;});}

function photoCount(l){return Array.isArray(l.photos)?l.photos.length:Number(l.photos)||0;}
function photoState(l){return l.photoStatus==="verified"?"verified":l.photoStatus==="rejected"?"rejected":(photoCount(l)>0?"pending":"none");}
function lstatus(l){return l.hidden?"hidden":l.sold?"sold":"active";}
function shortName(u){var p=String(u.name||"").split(" ");return p[0]+" "+((p[p.length-1]||"")[0]||"")+".";}
function logA(t){var a=getJSON(LOGKEY)||[];a.unshift({text:t,when:Date.now()});setJSON(LOGKEY,a.slice(0,300));}
function loadLocal(){
  var r=getJSON(KEY);RAW=r||{};
  D={users:RAW.users||[],listings:RAW.listings||[],wanted:RAW.wanted||[],deals:RAW.deals||[],reports:RAW.reports||[],reviews:RAW.reviews||[],messages:RAW.messages||[],removed:RAW.removed||[],support:getJSON(SUPKEY)||[]};
  SRC="local";FOUND=!!r;
}
function persist(){
  if(SRC!=="local")return;

async function broadcast(){
  var aud=$("#bcAud").value,text=$("#bcText").value.trim(),msg=$("#bcMsg");
  if(!text){msg.textContent="Write a message first.";return;}
  var L=D.users.filter(function(u){
    if(u.blocked||u.deleteAt)return false;
    if(aud==="sellers")return u.role==="seller";
    if(aud==="buyers")return u.role!=="seller";
    if(aud==="pending")return D.listings.some(function(l){return ownerKey(l)===uk(u)&&photoState(l)==="pending";});
    return true;
  });
  if(!L.length){msg.textContent="No one is in that group.";return;}
  if(L.length>200){msg.textContent="That group is too large (limit 200).";return;}
  if(!window.confirm("Send this message to "+L.length+" people?"))return;
  var ok=0;
  for(var i=0;i<L.length;i++){msg.textContent="Sending "+(i+1)+" of "+L.length+"…";if(await sendMsg(L[i],text,true))ok++;}
  logA("Sent a group message to "+ok+" people");persist();render();toast("Sent to "+ok+" people.");
}

function scanFlags(){
  var f=[];
  dupes().forEach(function(d){f.push({sev:"High",txt:d.kind+(d.kind==="ID"?" (scrambled)":" "+d.value)+" is used on "+d.users.length+" accounts: "+d.users.map(function(u){return u.name;}).join(", "),act:"user",id:uk(d.users[0])});});
  var rc={};
  D.reports.forEach(function(r){var l=D.listings.find(function(x){return x.id===r.id&&(x.device||"")===(r.device||"");});if(l){var k=ownerKey(l);rc[k]=(rc[k]||0)+1;}});
  Object.keys(rc).forEach(function(k){if(rc[k]>=2){var u=D.users.find(function(x){return uk(x)===k;});f.push({sev:"High",txt:(u?u.name:"A seller")+" has "+rc[k]+" reports against their listings",act:"user",id:k});}});
  D.listings.forEach(function(l){
    var u=userOf(l);
    if(l.price<500||l.price>50000000)f.push({sev:"Medium",txt:'Odd price on "'+l.title+'": '+money(l.price),act:"listing",id:l.id});
    if(photoCount(l)===0)f.push({sev:"Medium",txt:'"'+l.title+'" has no photos',act:"listing",id:l.id});
    if(u&&u.blocked&&!l.hidden&&!l.sold)f.push({sev:"High",txt:"Suspended seller "+u.name+' still has a live listing: "'+l.title+'"',act:"listing",id:l.id});
    if(u&&!u.verified&&!l.hidden)f.push({sev:"High",txt:"Seller "+u.name+' is not verified but has "'+l.title+'" live',act:"listing",id:l.id});
    if(u&&u.joined&&(Date.now()-new Date(u.joined).getTime())<2*864e5&&l.price>=500000)f.push({sev:"Medium",txt:"New account "+u.name+' listed a high-value item: "'+l.title+'" ('+money(l.price)+")",act:"listing",id:l.id});
  });
  var order={High:0,Medium:1,Low:2};
  return f.sort(function(a,b){return order[a.sev]-order[b.sev];});
}
function scanView(){
  var f=scanFlags(),hi=f.filter(function(x){return x.sev==="High";}).length;
  return banner()+'<h2>Risk scan</h2><p class="hint">Checks your data for signs of fraud or mistakes: duplicate phones and IDs, sellers with many reports, unverified sellers with live items, odd prices, missing photos and new accounts listing expensive items.</p><div class="cards"><div class="card"><span>Flags</span><strong>'+f.length+'</strong></div><div class="card"><span>High risk</span><strong>'+hi+"</strong></div></div>"+
    tbl(["","Level","What we found"],f.map(function(x){return tr([btn(x.act,x.id,"Open"),pill(x.sev,x.sev==="High"?"bad":"warn"),esc(x.txt)]);}));
}

  h+='<div class="kv"><span>Price</span><b>'+money(l.price)+'</b><span>Seller</span><b>'+esc(l.seller)+(o?' · <a href="#" data-act="user" data-id="'+esc(uk(o))+'">open profile</a>':"")+'</b><span>Where</span><b>'+esc(l.area||"")+", "+esc(l.state)+'</b><span>Kind</span><b>'+esc(l.kind||"used")+'</b><span>Status</span><b>'+pill(lstatus(l),l.sold?"warn":l.hidden?"bad":"ok")+" "+pill("photos "+ps,ps==="verified"?"ok":ps==="rejected"?"bad":ps==="pending"?"warn":"")+"</b></div>";
  if(ed)h+='<h3>Actions</h3><div class="row">'+btn("photo-ok",id,"Verify photos")+btn("photo-no",id,"Reject photos","danger")+btn("hide",id,l.hidden?"Unhide":"Hide")+btn("feature",id,"Feature 7 days")+btn("lsold",id,l.sold?"Mark available":"Mark sold")+btn("ldel",id,"Delete","danger")+"</div>";
  if(o)h+='<h3>Contact the seller</h3><div class="row">'+contact(o)+"</div>";
  openDlg(h);
}
function reportDlg(i){
  var r=D.reports[i];if(!r)return;
  var l=D.listings.find(function(x){return x.id===r.id&&(x.device||"")===(r.device||"");});
  var by=D.users.find(function(u){return uk(u)===((r.device?r.device+"|":"")+r.by);});
  openDlg(head("Report")+'<div class="kv"><span>Item</span><b>'+esc(l?l.title:"(removed)")+'</b><span>Reason</span><b>'+esc(r.reason)+'</b><span>Reported by</span><b>'+esc(by?by.name:r.by)+'</b><span>When</span><b>'+esc(day(r.when))+'</b></div>'+(canEdit()?'<div class="row">'+btn("rep-dismiss",i,"Dismiss")+(l?btn("rep-remove",i,"Remove listing","danger")+btn("rep-suspend",i,"Suspend seller","danger"):"")+"</div>":"")+(l?'<div class="row"><button class="btn line sm" type="button" data-act="listing" data-id="'+l.id+'">Open the listing</button></div>':""));
}
function csvDlg(title,text){openDlg(head(title)+'<textarea class="field" id="csvOut" readonly rows="8"></textarea><div class="row"><button class="btn sm" type="button" data-act="copy">Copy</button><button class="btn line sm" type="button" data-act="download" data-id="'+esc(title)+'">Download file</button></div>');$("#csvOut").value=text;}

/* ---------- actions ---------- */
function findL(id){return D.listings.find(function(l){return String(l.id)===String(id);});}
function pushNote(u,t){u.notes=u.notes||[];u.notes.unshift({text:t,when:Date.now()});}
function purge(u){
  var id=u.id,sn=shortName(u);
  var myL=D.listings.filter(function(l){return l.owner===id;}).map(function(l){return l.id;}),myW=D.wanted.filter(function(w){return w.owner===id;}).map(function(w){return w.id;});
  function drop(a,f){for(var i=a.length-1;i>=0;i--)if(f(a[i]))a.splice(i,1);}
  drop(D.listings,function(l){return l.owner===id;});drop(D.wanted,function(w){return w.owner===id;});
  drop(D.messages,function(m){return m.buyer===id||m.rid===id||myL.indexOf(m.lid)>=0||myW.indexOf(m.wid)>=0;});
  drop(D.reviews,function(r){return r.byId===id||(r.mine&&r.seller===sn);});drop(D.reports,function(r){return r.by===id;});
  D.deals.forEach(function(d){if(d.buyer===id)d.buyer="deleted";if(d.seller===id){d.seller=null;d.sellerName="Deleted seller";}});
  D.users.splice(D.users.indexOf(u),1);if(RAW.uid===id)RAW.uid=null;
  D.support=D.support.filter(function(m){return String(m.uid)!==String(id)||(SRC==="cloud"&&(m.device||"")!==(u.device||""));});if(SRC==="local")setJSON(SUPKEY,D.support);
}
var csvName="";
async function act(a,id,el){
  var u,l;
  if(["block","verify-user","credit","notify","restore","purge"].indexOf(a)>=0){u=D.users.find(function(x){return uk(x)===id;});if(!u)return;}
  if(!canEdit()&&["user","listing","report","chat","tpl","msg-start","broadcast","note-save","csv-messages","copy-script","copy-config","copy-invite","gen-config","close","tab","cloud-test","cloud-load","src-local","src-demo","csv-users","csv-listings","csv-deals","backup","copy","download","photos","wphoto","lock","chpass","clearlog"].indexOf(a)<0){toast("The cloud view is read-only.");return;}
  switch(a){
    case "close":closeDlg();return;
    case "user":userDlg(id);return;
    case "listing":listingDlg(id);return;
    case "chat":chatDlg(id);return;
    case "tpl":$("#msgText").value=TEMPLATES[+id][1];$("#msgText").focus();return;
    case "msg-start":chatDlg($("#startSel").value);return;
    case "broadcast":await broadcast();return;
    case "note-save":var nm=getJSON(NOTESK)||{};nm[id]=$("#adminNote").value.trim();setJSON(NOTESK,nm);toast("Note saved.");return;
    case "copy-script":case "copy-config":case "copy-invite":
      var srcEl=a==="copy-script"?$("#scriptBox"):a==="copy-config"?$("#cfgOut"):$("#inviteBox");
      if(!srcEl.value){toast("Nothing to copy yet.");return;}
      try{await navigator.clipboard.writeText(srcEl.value);toast("Copied.");}catch(e){srcEl.select();toast("Press copy on your keyboard.");}return;
    case "gen-config":
      var gu=$("#cloudUrl").value.trim();
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(gu)){$("#cloudErr").textContent="Paste the full web app address that ends in /exec.";return;}
      $("#cloudErr").textContent="";$("#cfgOut").value='window.DECLUTA_CLOUD = "'+gu+'";';toast("Now put this line in a file named config.js on GitHub.");return;
    case "csv-messages":csvDlg("Messages",csv([["when","user id","device","from","text"]].concat(D.support.map(function(m){return [new Date(m.when).toISOString(),m.uid,m.device,m.from,m.text];}))));return;
    case "report":reportDlg(+id);return;
    case "photos":l=findL(id);if(l&&Array.isArray(l.photos))openDlg(head(l.title)+'<div class="photos">'+l.photos.map(function(p){return '<img src="'+esc(p)+'" alt="Photo of '+esc(l.title)+'">';}).join("")+"</div>");return;
    case "wphoto":var w=D.wanted.find(function(x){return String(x.id)===String(id);});if(w&&w.photo)openDlg(head(w.title)+'<div class="photos"><img src="'+esc(w.photo)+'" alt=""></div>');return;
    case "block":u.blocked=!u.blocked;logA((u.blocked?"Suspended ":"Unsuspended ")+u.name);toast(u.blocked?"Account suspended.":"Account unsuspended.");break;
    case "verify-user":u.verified=true;logA("Marked "+u.name+" as verified");toast("Marked as verified.");break;
    case "credit":var amt=Number($("#credAmt").value);if(!amt||amt<1){toast("Enter an amount.");return;}u.credit=(u.credit||0)+amt;pushNote(u,"You received "+money(amt)+" credit from Decluta.");logA("Gave "+u.name+" "+money(amt)+" credit");toast("Credit added.");break;
    case "notify":var tx=$("#noteTxt").value.trim();if(!tx){toast("Write a message first.");return;}pushNote(u,tx);logA("Sent a message to "+u.name);toast("Message sent. They will see it in their account.");break;
    case "restore":delete u.deleteAt;logA("Restored "+u.name);toast("Account restored.");break;
    case "purge":if(!window.confirm("Permanently delete "+u.name+" and everything they posted? This can't be undone."))return;purge(u);logA("Deleted account "+u.name);toast("Account deleted.");closeDlg();break;
    case "photo-ok":l=findL(id);l.photoStatus="verified";l.hidden=false;logA("Verified photos: "+l.title);toast("Photos verified.");break;
    case "photo-no":l=findL(id);l.photoStatus="rejected";l.hidden=true;var o=D.users.find(function(x){return x.id===l.owner;});if(o)pushNote(o,"Photos rejected for "+l.title+". Add clearer photos in My account to relist.");logA("Rejected photos: "+l.title);toast("Photos rejected and the listing is hidden.");break;
    case "hide":l=findL(id);l.hidden=!l.hidden;logA((l.hidden?"Hid ":"Unhid ")+l.title);break;
    case "feature":l=findL(id);l.boostUntil=Date.now()+7*864e5;logA("Featured "+l.title);toast("Featured for 7 days.");break;
    case "lsold":l=findL(id);l.sold=!l.sold;logA("Changed sold status: "+l.title);break;
    case "ldel":l=findL(id);if(!window.confirm('Delete "'+l.title+'"?'))return;D.listings.splice(D.listings.indexOf(l),1);D.removed.push(l.id);logA("Deleted listing "+l.title);toast("Listing deleted.");break;
    case "wdel":var wi=D.wanted.findIndex(function(x){return String(x.id)===String(id);});if(wi>=0&&window.confirm("Delete this request?")){logA("Deleted wanted request "+D.wanted[wi].title);D.wanted.splice(wi,1);toast("Request deleted.");}break;
    case "rep-dismiss":D.reports.splice(+id,1);logA("Dismissed a report");break;
    case "rep-remove":var r=D.reports[+id];l=findL(r.id);if(l&&window.confirm('Remove "'+l.title+'"?')){D.listings.splice(D.listings.indexOf(l),1);D.removed.push(l.id);}D.reports.splice(+id,1);logA("Removed a reported listing");toast("Listing removed.");break;
    case "rep-suspend":var r2=D.reports[+id];l=findL(r2.id);var ow=l&&D.users.find(function(x){return x.id===l.owner;});if(ow){ow.blocked=true;logA("Suspended "+ow.name+" after a report");toast("Seller suspended.");}D.reports.splice(+id,1);break;
    case "rev-del":D.reviews.splice(+id,1);logA("Deleted a review");break;
    case "src-local":loadLocal();toast(FOUND?"Showing this browser's data.":"No website data found in this browser.");break;
    case "src-demo":demo();toast("Demo data loaded.");break;
    case "csv-users":csvDlg("Users",csv([["id","name","phone","role","verified","joined","status","credit","purchases","sales"]].concat(D.users.map(function(x){return [x.id,x.name,x.phone,x.role,x.verified?"yes":"no",x.joined,ustatus(x),x.credit||0,x.purchases||0,x.sales||0];}))));return;
    case "csv-listings":csvDlg("Listings",csv([["id","title","category","state","price","seller","status","photos"]].concat(D.listings.map(function(x){return [x.id,x.title,x.cat,x.state,x.price,x.seller,lstatus(x),photoState(x)];}))));return;
    case "csv-deals":csvDlg("Deals",csv([["id","title","price","fee","commission","method","when"]].concat(D.deals.map(function(x){return [x.id,x.title,x.price,x.fee,x.commission,x.method,new Date(x.when).toISOString()];}))));return;
    case "backup":csvDlg("Backup",JSON.stringify({users:D.users,listings:D.listings,wanted:D.wanted,deals:D.deals,reports:D.reports,reviews:D.reviews,messages:D.messages,removed:D.removed}));return;
    case "copy":try{await navigator.clipboard.writeText($("#csvOut").value);toast("Copied.");}catch(e){$("#csvOut").select();toast("Press copy on your keyboard.");}return;
    case "download":var bl=new Blob([$("#csvOut").value],{type:"text/plain"}),an=document.createElement("a");an.href=URL.createObjectURL(bl);an.download="decluta-"+id.toLowerCase()+".txt";document.body.appendChild(an);an.click();an.remove();return;
    case "import":
      try{var j=JSON.parse($("#importBox").value);if(!j||!Array.isArray(j.users))throw 0;}catch(e){toast("That doesn't look like a backup.");return;}
      if(!window.confirm("Replace the data in this browser with this backup?"))return;
      var cur=getJSON(KEY)||{};["users","listings","wanted","deals","reports","reviews","messages","removed"].forEach(function(k){cur[k]=j[k]||[];});setJSON(KEY,cur);loadLocal();logA("Restored a backup");toast("Backup restored.");break;
    case "cloud-test":case "cloud-load":await cloud(a);return;
    case "chpass":await changePass();return;
    case "clearlog":setJSON(LOGKEY,[]);toast("Log cleared.");break;
    case "lock":try{sessionStorage.removeItem("dng-admin-ok");}catch(e){}showGate();return;
  }
  persist();render();
  if(["block","verify-user","credit","notify","restore"].indexOf(a)>=0&&$("#dlg").open)userDlg(id);
  if(["photo-ok","photo-no","hide","feature","lsold"].indexOf(a)>=0&&$("#dlg").open)listingDlg(id);
  if(["ldel","rep-dismiss","rep-remove","rep-suspend"].indexOf(a)>=0)closeDlg();
}
async function cloud(a){
  var url=$("#cloudUrl").value.trim(),key=$("#cloudKey").value,err=$("#cloudErr");
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)){err.textContent="Paste the full web app address that ends in /exec.";return;}
  if(a==="cloud-load"&&key.length<16){err.textContent="Your admin key is too short. Use at least 16 letters and numbers in your Google script, then enter it here.";return;}
  setJSON(CFG,{url:url});err.textContent="Working…";
  try{
    var r=await fetch(url+"?action="+(a==="cloud-test"?"ping":"list&key="+encodeURIComponent(key)));
    var j=await r.json();
    if(a==="cloud-test"){err.textContent=j.ok?"Connected. Your Google script is reachable.":"The script answered, but not as expected.";return;}
    if(!j.ok){err.textContent="Not allowed. Check your admin key.";return;}
    loadCloud(j);CK={url:url,key:key};logA("Loaded cloud data");toast("Loaded "+D.users.length+" users from the cloud.");persist();render();
  }catch(e){err.textContent="Could not reach your Google script. Check the address and that it is deployed for 'Anyone'.";}
}
async function changePass(){
  var a=getJSON(AUTH),o=$("#oldp").value,n=$("#newp").value,er=$("#setErr");
  if(await sha(a.salt+o)!==a.hash){er.textContent="Current passcode is wrong.";return;}
  if(n.length<8){er.textContent="Use at least 8 characters.";return;}
  var salt=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function(x){return x.toString(16).padStart(2,"0");}).join("");
  setJSON(AUTH,{salt:salt,hash:await sha(salt+n)});$("#oldp").value="";$("#newp").value="";er.textContent="";toast("Passcode changed.");
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");
  if(t){TAB=t.dataset.tab;render();window.scrollTo(0,0);return;}
  var b=e.target.closest("[data-act]");
  if(b){e.preventDefault();act(b.dataset.act,b.dataset.id,b);}
});

/* ---------- start ---------- */
function enter(){
  $("#gate").hidden=true;$("#app").hidden=false;
  if(SRC!=="demo"&&SRC!=="cloud")loadLocal();
  render();
}
var ok=false;try{ok=sessionStorage.getItem("dng-admin-ok")==="1";}catch(e){}
if(ok&&getJSON(AUTH))enter();else showGate();
})();
</script>
