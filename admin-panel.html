<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<title>Decluta Admin</title>
<style>
:root{--bg:#F6F7F4;--surface:#fff;--ink:#15201A;--muted:#58665D;--line:#DCE1DA;--green:#0E6B3F;--yellow:#FFC20E;--red:#C0341D;--blue:#1D6FE0;--font:'Segoe UI',system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0F1511;--surface:#17201A;--ink:#EDF2EE;--muted:#9BAAA0;--line:#2A362E;--green:#23895A;--red:#FF8A75}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px;background:var(--green);color:#fff}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.ink{background:#15201A;color:#fff}
.field{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 4px}
.hint{color:var(--muted);font-size:14px;margin:4px 0}
.err{color:var(--red);font-size:14px;min-height:1.2em;margin:6px 0 0}
.gate{max-width:420px;margin:12vh auto 0;padding:24px 18px}
.gate h1{font-size:26px;margin:0 0 6px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#15201A;color:#fff;position:sticky;top:0;z-index:5}
.bar strong{font-size:18px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--yellow);color:#15201A}
.bar .sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1.5px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:17px;margin:18px 0 6px}
.notice{border-radius:10px;padding:10px 14px;margin:0 0 14px;background:color-mix(in srgb,var(--yellow) 25%,var(--surface));font-size:15px}
.notice.warn{background:color-mix(in srgb,var(--red) 14%,var(--surface))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.card span{display:block;color:var(--muted);font-size:13px}
.card strong{font-size:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters .field{flex:1;min-width:130px}
.tbl{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:none;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--ink)}
.pill.ok{background:color-mix(in srgb,var(--green) 22%,var(--surface))}
.pill.bad{background:color-mix(in srgb,var(--red) 22%,var(--surface))}
.pill.warn{background:color-mix(in srgb,var(--yellow) 45%,var(--surface))}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
a{color:var(--ink)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 10px 4px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
.chart small{font-size:10px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.hbar b{display:block;height:10px;background:var(--green);border-radius:5px}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100% - 20px));max-height:calc(100% - 20px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,12,.6)}
.dlg{padding:18px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:transparent;color:var(--ink);font-size:28px;width:44px;height:44px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:15px}
.kv span{color:var(--muted)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{max-width:100%;max-height:70vh;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#15201A;color:#fff;padding:12px 18px;border-radius:10px;max-width:calc(100% - 32px);z-index:50;font-weight:600}
.toast[hidden]{display:none}
[hidden]{display:none!important}
textarea.field{min-height:100px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;margin:10px 0;padding:4px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:15px;word-break:break-word}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff}
.msg.them{align-self:flex-start;background:var(--bg);border:1.5px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pwwrap{position:relative}
.pwwrap .field{padding-right:46px}
.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--muted);border-radius:8px;padding:0}
.pweye:hover{color:var(--ink)}
.cloudmsg{color:var(--ink);font-size:14px;margin:6px 0 0;white-space:pre-wrap}
.cloudmsg.bad{color:var(--red)}
.cloudmsg.good{color:var(--green)}
</style>
</head>
<body>
<noscript>Please turn on JavaScript to use the admin page.</noscript>

<div class="gate" id="gate" hidden>
  <h1 id="gateTitle">Admin sign in</h1>
  <p class="hint" id="gateText"></p>
  <form id="gateForm" novalidate>
    <label for="pass">Passcode</label>
    <input class="field" id="pass" type="password" autocomplete="current-password">
    <div id="pass2Wrap"><label for="pass2">Repeat passcode</label><input class="field" id="pass2" type="password" autocomplete="new-password"></div>
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn" type="submit" style="width:100%;margin-top:6px">Continue</button>
  </form>
  <p style="text-align:center;margin-top:10px"><button class="btn line sm" id="gateReset" type="button" hidden>Forgot passcode? Reset it on this device</button></p>
  <p class="hint" style="margin-top:16px">This page is private to you. It is not linked from the public website.</p>
</div>

<div class="gate" id="connect" hidden>
  <h1>Admin sign in</h1>
  <p class="hint">Type your admin key. It works the same on your phone and your laptop. There is no other password.</p>
  <form id="cnForm" novalidate>
    <details id="cnAdv"><summary>Google address (already saved)</summary>
    <label for="cnUrl">Web app address (ends in /exec)</label>
    <input class="field" id="cnUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></details>
    <label for="cnKey">Admin key</label>
    <input class="field" id="cnKey" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="cnKeep"> Keep me signed in on this device</label>
    <p class="hint" style="margin:2px 0 0">Tick this only on your own phone or laptop.</p>
    <p class="cloudmsg" id="cnErr" role="alert"></p>
    <button class="btn" type="submit" style="width:100%;margin-top:6px">Sign in</button>
  </form>
  <p style="text-align:center;margin-top:10px"><button class="btn line sm" id="cnTest" type="button">Test the address only</button></p>
  <p style="text-align:center;margin-top:12px"><button class="btn line sm" id="cnSkip" type="button">Open without the key (this browser's data only)</button></p>
</div>

<div id="app" hidden>
  <header class="bar"><strong>Decluta Admin</strong><span class="badge" id="srcBadge"></span><span class="sp"></span><input class="field" id="gs" placeholder="Search anything" aria-label="Search anything" style="max-width:190px;min-height:36px;padding:4px 10px"><button class="btn line sm" id="lockBtn" type="button" style="color:#fff;border-color:#5a6a60">Sign out</button></header>
  <nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
  <main id="view"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>if(self!==top&&/(^|\.)github\.io$|^(www\.)?decluta\.com$/.test(location.hostname)){document.documentElement.innerHTML="";}</script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
/* Buttons and Enter work even where the browser blocks form sending (for example inside a preview panel). */
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest('button[type="submit"]');if(!b||!b.form)return;e.preventDefault();b.form.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));},true);
document.addEventListener("keydown",function(e){if(e.key!=="Enter"||!e.target||e.target.tagName!=="INPUT"||!e.target.form)return;e.preventDefault();e.target.form.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));},true);
var SCRIPT_TEXT="// Decluta.com cloud record + support messages + Safe Pay orders (Google Apps Script) - version 3\n// Your admin key is NOT in this file. It lives in the separate file Key.gs,\n// so you can paste a new version of this file at any time without touching your key.\n// After you change this code, choose Deploy > Manage deployments > pencil > New version > Deploy.\n\nconst SCRIPT_VERSION = \"decluta-3\";\n// ADMIN_KEY is defined in Key.gs\n\nconst SHEETS = {\n  users: [\"device\",\"id\",\"name\",\"phone\",\"role\",\"verified\",\"idType\",\"idHash\",\"joined\",\"status\",\"deleteAt\",\"credit\",\"purchases\",\"sales\",\"terms\",\"consentAt\",\"bio\",\"updatedAt\"],\n  listings: [\"device\",\"id\",\"title\",\"cat\",\"state\",\"area\",\"price\",\"kind\",\"seller\",\"owner\",\"sold\",\"hidden\",\"photoStatus\",\"photos\",\"when\",\"updatedAt\"],\n  wanted: [\"device\",\"id\",\"title\",\"cat\",\"state\",\"budget\",\"owner\",\"found\",\"hasPhoto\",\"updatedAt\"],\n  deals: [\"device\",\"id\",\"title\",\"price\",\"fee\",\"commission\",\"buyer\",\"seller\",\"method\",\"when\",\"updatedAt\"],\n  reports: [\"device\",\"id\",\"reason\",\"by\",\"when\",\"updatedAt\"],\n  reviews: [\"device\",\"seller\",\"stars\",\"text\",\"by\",\"updatedAt\"]\n};\nconst SUPPORT_COLS = [\"id\",\"device\",\"uid\",\"from\",\"name\",\"text\",\"when\"];\n\n// ---- Safe Pay orders: the company holds the money until the buyer confirms ----\nconst ORDER_COLS = [\"id\",\"device\",\"buyerId\",\"buyerName\",\"buyerPhone\",\"sellerId\",\"sellerName\",\"sellerPhone\",\"sellerLocal\",\"listingId\",\"title\",\"price\",\"fee\",\"total\",\"commissionPct\",\"commission\",\"payout\",\"method\",\"state\",\"status\",\"payRef\",\"createdAt\",\"paidAt\",\"refundBy\",\"receivedAt\",\"refundReason\",\"refundNote\",\"refundBank\",\"refundAcctNo\",\"refundAcctName\",\"refundAt\",\"decisionNote\",\"adminNote\",\"decidedAt\",\"updatedAt\"];\nconst ORDER_NUMS = [\"price\",\"fee\",\"total\",\"commissionPct\",\"commission\",\"payout\",\"createdAt\",\"paidAt\",\"refundBy\",\"receivedAt\",\"refundAt\",\"decidedAt\",\"updatedAt\"];\nconst REFUND_DAYS = 7;                       // a buyer can ask for a refund for 7 days after payment is confirmed\nconst COMMISSION_CHOICES = [0, 2, 10, 25];   // percent of the item price taken from the seller\nconst REFUND_REASONS = [\"Item not received\", \"Not as described\", \"Arrived damaged\", \"Changed my mind\"];\nconst OPEN_STATES = [\"awaiting_payment\", \"held\", \"received\", \"refund_requested\"];\n\n// Safety limits so strangers cannot flood your sheet.\nconst CAPS = { users: 100, listings: 500, wanted: 300, deals: 500, reports: 200, reviews: 300 };\nconst MAX_BODY = 300000;        // largest message the website may send\nconst MAX_SHEET_ROWS = 20000;   // stop writing when a sheet is this full\nconst DEVICE_RE = /^D[a-z0-9-]{6,40}$/i;\nconst UID_RE = /^U[0-9]{3,8}$/;\nconst MID_RE = /^M[a-z0-9]{6,40}$/i;\n\nfunction clip_(v, n) { return String(v === undefined || v === null ? \"\" : v).slice(0, n); }\n\n// Stops text that starts with = + - @ from being treated as a formula.\nfunction safe_(v) {\n  const s = String(v === undefined || v === null ? \"\" : v);\n  return /^[=+\\-@]/.test(s) ? \"'\" + s : s;\n}\nfunction unsafe_(v) {\n  return typeof v === \"string\" ? v.replace(/^'([=+\\-@])/, \"$1\") : v;\n}\n\nfunction keyOk_() {\n  const k = String(ADMIN_KEY).trim();\n  return k && k !== \"CHANGE_ME_TO_A_LONG_SECRET\" && k.length >= 16;\n}\n// Returns \"ok\", \"bad\", \"locked\" or \"weakkey\". Too many wrong keys pauses key checks for 10 minutes.\nfunction checkKey_(k) {\n  k = String(k === undefined || k === null ? \"\" : k).trim();\n  const cache = CacheService.getScriptCache();\n  const fails = Number(cache.get(\"keyfails\") || 0);\n  if (fails >= 20) return \"locked\";\n  if (!keyOk_()) return \"weakkey\";\n  if (k !== String(ADMIN_KEY).trim()) { cache.put(\"keyfails\", String(fails + 1), 600); return \"bad\"; }\n  return \"ok\";\n}\nfunction rateOk_(name, limit, secs) {\n  const c = CacheService.getScriptCache();\n  const n = Number(c.get(name) || 0);\n  if (n >= limit) return false;\n  c.put(name, String(n + 1), secs);\n  return true;\n}\n\nfunction sheetFor_(name, cols) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    sh.getRange(1, 1, sh.getMaxRows(), cols.length).setNumberFormat(\"@\"); // keep phone numbers as text\n    sh.appendRow(cols);\n    sh.setFrozenRows(1);\n  }\n  return sh;\n}\nfunction sheet_(name) { return sheetFor_(name, SHEETS[name]); }\nfunction supportSheet_() { return sheetFor_(\"support\", SUPPORT_COLS); }\nfunction orderSheet_() { return sheetFor_(\"orders\", ORDER_COLS); }\n\nfunction cfg_() {\n  const raw = PropertiesService.getScriptProperties().getProperty(\"config\");\n  let c = {};\n  try { c = JSON.parse(raw || \"{}\") || {}; } catch (x) { c = {}; }\n  return { commissionPct: COMMISSION_CHOICES.indexOf(Number(c.commissionPct)) >= 0 ? Number(c.commissionPct) : 0, bank: clip_(c.bank, 60), acctNo: clip_(c.acctNo, 20), acctName: clip_(c.acctName, 80) };\n}\nfunction cfgPublic_() { const c = cfg_(); c.refundDays = REFUND_DAYS; return c; }\n\nfunction orderFromRow_(r) {\n  const o = {};\n  ORDER_COLS.forEach(function (k, i) { o[k] = unsafe_(r[i]); });\n  ORDER_NUMS.forEach(function (k) { o[k] = Number(o[k]) || 0; });\n  return o;\n}\nfunction readOrders_() {\n  const v = orderSheet_().getDataRange().getValues();\n  v.shift();\n  return v.filter(function (r) { return r[0]; }).map(orderFromRow_);\n}\nfunction findOrder_(id) {\n  const sh = orderSheet_(), last = sh.getLastRow();\n  if (last < 2) return null;\n  const vals = sh.getRange(2, 1, last - 1, ORDER_COLS.length).getValues();\n  for (let i = 0; i < vals.length; i++) {\n    if (String(vals[i][0]) === String(id)) return { sh: sh, row: i + 2, o: orderFromRow_(vals[i]) };\n  }\n  return null;\n}\nfunction writeOrder_(f) {\n  f.o.updatedAt = Date.now();\n  const row = ORDER_COLS.map(function (c) { return safe_(clip_(f.o[c], 300)); });\n  f.sh.getRange(f.row, 1, 1, ORDER_COLS.length).setValues([row]);\n}\nfunction appendOrder_(o) {\n  const sh = orderSheet_();\n  if (sh.getLastRow() > MAX_SHEET_ROWS) return null;\n  o.updatedAt = Date.now();\n  const row = ORDER_COLS.map(function (c) { return safe_(clip_(o[c], 300)); });\n  sh.getRange(sh.getLastRow() + 1, 1, 1, ORDER_COLS.length).setValues([row]);\n  return { sh: sh, row: sh.getLastRow(), o: o };\n}\n// What a buyer is allowed to see about their own order.\nfunction pubOrder_(o) {\n  const keys = [\"id\",\"listingId\",\"title\",\"price\",\"fee\",\"total\",\"method\",\"state\",\"status\",\"payRef\",\"createdAt\",\"paidAt\",\"refundBy\",\"receivedAt\",\"refundReason\",\"refundNote\",\"refundBank\",\"refundAcctNo\",\"refundAcctName\",\"refundAt\",\"decisionNote\",\"decidedAt\",\"sellerName\",\"sellerId\",\"commission\"];\n  const r = {};\n  keys.forEach(function (k) { r[k] = o[k]; });\n  return r;\n}\nfunction tellUser_(device, uid, text) {\n  if (!DEVICE_RE.test(String(device)) || !UID_RE.test(String(uid))) return;\n  appendSupport_({ id: \"M\" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), device: device, uid: uid, from: \"admin\", name: \"Decluta Safe Pay\", text: text, when: Date.now() });\n}\nfunction naira_(n) { return \"N\" + Number(n || 0).toLocaleString(\"en-NG\"); }\nfunction dateStr_(t) { return new Date(Number(t)).toUTCString().slice(0, 22) + \" UTC\"; }\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction appendSupport_(m) {\n  if (!DEVICE_RE.test(String(m.device)) || !UID_RE.test(String(m.uid)) || !MID_RE.test(String(m.id))) return false;\n  const text = clip_(m.text, 500).trim();\n  if (!text) return false;\n  const sh = supportSheet_();\n  const last = sh.getLastRow();\n  if (last > MAX_SHEET_ROWS) return false;\n  if (last > 1) {\n    const ids = sh.getRange(2, 1, last - 1, 1).getValues();\n    for (let i = 0; i < ids.length; i++) if (String(ids[i][0]) === String(m.id)) return true; // already stored\n  }\n  const rec = { id: m.id, device: m.device, uid: m.uid, from: m.from, name: clip_(m.name, 60), text: text, when: clip_(m.when, 20) };\n  const row = SUPPORT_COLS.map(function (c) { return safe_(clip_(rec[c], 500)); });\n  sh.getRange(sh.getLastRow() + 1, 1, 1, SUPPORT_COLS.length).setValues([row]);\n  return true;\n}\n\nfunction readSupport_() {\n  const v = supportSheet_().getDataRange().getValues();\n  v.shift();\n  return v.map(function (r) {\n    const o = {};\n    SUPPORT_COLS.forEach(function (k, i) { o[k] = unsafe_(r[i]); });\n    return o;\n  });\n}\n\n// The website sends either a snapshot of what one browser holds, or a support message.\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    if (!e || !e.postData || !e.postData.contents || e.postData.contents.length > MAX_BODY) return out_({ ok: false });\n    let d;\n    try { d = JSON.parse(e.postData.contents); } catch (x) { return out_({ ok: false }); }\n    if (!d || typeof d !== \"object\" || !DEVICE_RE.test(String(d.device || \"\"))) return out_({ ok: false });\n\n    if (d.type === \"support\") {\n      if (d.from !== \"user\") return out_({ ok: false });\n      if (!rateOk_(\"sup:\" + d.device, 30, 3600)) return out_({ ok: false, error: \"slow down\" });\n      return out_({ ok: appendSupport_({ id: d.id, device: d.device, uid: d.uid, from: \"user\", name: d.name, text: d.text, when: d.when }) });\n    }\n\n    if (!rateOk_(\"snap:\" + d.device, 60, 3600)) return out_({ ok: false, error: \"slow down\" });\n    const now = new Date().toISOString();\n    Object.keys(SHEETS).forEach(function (name) {\n      const sh = sheet_(name), cols = SHEETS[name];\n      const last = sh.getLastRow();\n      if (last > 1) {\n        const devs = sh.getRange(2, 1, last - async function broadcast(){
  var aud=$("#bcAud").value,text=$("#bcText").value.trim(),msg=$("#bcMsg");

  var L=D.users.filter(function(u){
    if(u.blocked||u.deleteAt)return false;
    if(aud==="sellers")return u.role==="seller";
    if(aud==="buyers")return u.role!=="seller";
    if(aud==="pending")return D.listings.some(function(l){return ownerKey(l)===uk(u)&&photoState(l)==="pending";});
    return true;
  });
  if(!L.length){msg.textContent="No one is in that group.";return;}

  for(var i=0;i<L.length;i++){msg.textContent="Sending "+(i+1)+" of "+L.length+"…";if(await sendMsg(L[i],text,true))ok++;}

}

function scanFlags(){
  var f=[];
  dupes().forEach(function(d){f.push({sev:"High",txt:d.kind+(d.kind==="ID"?" (scrambled)":" "+d.value)+" is used on "+d.users.length+" accounts: "+d.users.map(function(u){return u.name;}).join(", "),act:"user",id:uk(d.users[0])});});
  var rc={};
  D.reports.forEach(function(r){var l=D.listings.find(function(x){return x.id===r.id&&(x.device||"")===(r.device||"");});if(l){var k=ownerKey(l);rc[k]=(rc[k]||0)+1;}});
  Object.keys(rc).forEach(function(k){if(rc[k]>=2){var u=D.users.find(function(x){return uk(x)===k;});f.push({sev:"High",txt:(u?u.name:"A seller")+" has "+rc[k]+" reports against their listings",act:"user",id:k});}});
  D.listings.forEach(function(l){
    var u=userOf(l);

async function payAct(a,id,el){
  if(a==="pay-open"){payDlg(id);return;}
  if(a==="pay-copy"){try{await navigator.clipboard.writeText(id);toast("Copied.");}catch(e){toast("Could not copy. Select it and copy by hand.");}return;}
  if(!CK){toast("Sign in with your admin key first.");return;}
  var o=ORD().find(function(x){return x.id===id;});
  try{
    if(a==="pay-refresh"){await reloadCloud();render();toast("Orders refreshed.");return;}
    if(a==="set-com"){
      var p=Number(id),c=D.cfg||{};
      if(!window.confirm((p?"Turn commission ON at "+p+"%":"Turn commission OFF")+"?\n\nIt applies to new orders from now. Orders already made keep their old rate."))return;
      await cloudGet(CK.url,{action:"config_set",key:CK.key,commissionPct:p,bank:c.bank||"",acctNo:c.acctNo||"",acctName:c.acctName||""});
      logA("Commission set to "+(p?p+"%":"off"));await reloadCloud();render();toast(p?"Commission is ON at "+p+"%.":"Commission is OFF.");return;
    }
    if(a==="save-acct"){
      var bank=$("#payBank").value.trim(),no=$("#payNo").value.replace(/\s/g,""),nm=$("#payName").value.trim(),c2=D.cfg||{};
      if(bank.length<2||!/^[0-9]{10}$/.test(no)||nm.length<2){toast("Fill the bank, a 10 digit account number and the account name.");return;}
      await cloudGet(CK.url,{action:"config_set",key:CK.key,commissionPct:Number(c2.commissionPct)||0,bank:bank,acctNo:no,acctName:nm});
      logA("Saved the payment account");await reloadCloud();render();toast("Account saved. Buyers will now see it.");return;
    }
    if(!o){toast("Order not found. Tap Refresh orders.");return;}
    var params={action:"order_admin",key:CK.key,id:o.id},msg="";
    if(a==="pay-mark"){
      var amt=Math.round(Number($("#payAmt").value));
      if(!amt){toast("Type the amount you received.");return;}
      params.op="mark_paid";params.amount=amt;msg="Payment confirmed. The money is held and the buyer has 7 days to ask for a refund.";
    }else if(a==="pay-release"){
      var early=el&&el.dataset&&el.dataset.force==="1";
      if(!window.confirm((early?"The buyer has NOT confirmed and the refund period is still open.\n\n":"")+"Confirm you have sent "+money(o.payout)+" to the seller from your bank.\nThis marks the order as paid out."))return;
      params.op="release";if(early)params.force="1";msg="Marked as paid to the seller.";
    }else if(a==="pay-refund"){
      if(!window.confirm("Confirm you have sent "+money(o.total)+" to "+o.refundBank+" "+o.refundAcctNo+" ("+o.refundAcctName+")."))return;
      params.op="refund";msg="Marked as refunded.";
    }else if(a==="pay-reject"){
      var why=$("#payNote").value.trim();if(why.length<3){toast("Write the reason the buyer will see.");return;}
      params.op="reject_refund";params.note=why;msg="Refund rejected. The buyer was told why.";
    }else if(a==="pay-cancel"){
      if(!window.confirm("Cancel this order? Only do this if no payment arrived."))return;
      params.op="cancel";msg="Order cancelled.";
    }else if(a==="pay-note"){
      params.op="note";params.note=$("#payAdminNote").value.trim();msg="Note saved.";
    }else return;
    await cloudGet(CK.url,params);
    logA(msg+" ("+o.id+")");await reloadCloud();render();payDlg(o.id);toast(msg);
  }catch(e){toast(e.message);}
}

async function cloud(a){
  var url=$("#cloudUrl").value.trim(),key=$("#cloudKey").value.trim(),err=$("#cloudErr");
  function say(t,k){err.textContent=t;err.className="cloudmsg"+(k?" "+k:"");}
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)){say("Paste the full web app address that ends in /exec.","bad");return;}
  if(a==="cloud-load"&&!key){say("Type your admin key first. It is the secret you wrote in ADMIN_KEY inside your Google script.","bad");return;}
  setJSON(CFG,{url:url});say("Working…");
  try{
    if(a==="cloud-test"){await cloudGet(url,{action:"ping"});say("Connected. Your Google script is reachable.","good");return;}
    var j=await cloudGet(url,{action:"list",key:key});
    loadCloud(j);CK={url:url,key:key};logA("Loaded cloud data");
    var msg="Connected and your key was accepted. Loaded "+D.users.length+" users, "+D.listings.length+" listings and "+D.support.length+" messages from your Google Sheet.";
    if(!D.users.length)msg+="\nYour sheet has no users yet. This is normal until your website sends them:\n1) config.js on GitHub must contain your web app address (use Make config.js line).\n2) Open your users website once and wait 15 seconds.\n3) Come back here and tap Load again.";
    toast("Loaded "+D.users.length+" users from the cloud.");
    render();
    var e2=$("#cloudErr");if(e2){e2.textContent=msg;e2.className="cloudmsg "+(D.users.length?"good":"");}
  }catch(e){say(e.message,"bad");}
}
async function changePass(){
  var a=getJSON(AUTH),o=$("#oldp").value,n=$("#newp").value,er=$("#setErr");
  if(await sha(a.salt+o)!==a.hash){er.textContent="Current passcode is wrong.";return;}
  if(n.length<8){er.textContent="Use at least 8 characters.";return;}
  var salt=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function(x){return x.toString(16).padStart(2,"0");}).join("");
  setJSON(AUTH,{salt:salt,hash:await sha(salt+n)});$("#oldp").value="";$("#newp").value="";er.textContent="";toast("Passcode changed.");
}

async function connectNow(url,key){
  url=String(url||"").trim();key=String(key||"").trim();
  if(!url){cnSay("The web app address is missing. Paste the address that ends in /exec from Google Apps Script.","bad");return false;}
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)){cnSay("That address is not right. It must start with https://script.google.com/macros/s/ and end with /exec.","bad");return false;}
  if(!key){cnSay("The admin key is missing. Type the ADMIN_KEY you wrote inside your Google script.","bad");return false;}
  setJSON(CFG,{url:url});cnSay("Connecting…");
  try{
    var pg=await cloudGet(url,{action:"ping"});
    if(!pg||pg.version!=="decluta-3"){cnSay("Google answered, but the script running there is an OLD version. Paste the new Code.gs, save, then Deploy > Manage deployments > pencil > New version > Deploy.","bad");return false;}
    var j=await cloudGet(url,{action:"list",key:key});
    loadCloud(j);CK={url:url,key:key};
    try{
      sessionStorage.removeItem("dng-adm3-key");localStorage.removeItem("dng-adm3-keep");
      if($("#cnKeep").checked)localStorage.setItem("dng-adm3-keep",key);else sessionStorage.setItem("dng-adm3-key",key);
    }catch(e){}
    logA("Signed in");
    $("#connect").hidden=true;$("#app").hidden=false;TAB="overview";render();
    toast("Signed in. Loaded "+D.users.length+" users.");
    return true;
  }catch(e){
    try{sessionStorage.removeItem("dng-adm3-key");localStorage.removeItem("dng-adm3-keep");}catch(x){}
    cnSay(e.message+hostHint(),"bad");return false;
  }
}
function hostHint(){return /(^|\.)github\.io$|(^|\.)decluta\.com$|^localhost$/.test(location.hostname)?"":"\n\nNote: you are not on your real GitHub page. Previews often block Google. Open this page from your GitHub address and try again.";}
$("#cnTest").addEventListener("click",async function(){
  var url=$("#cnUrl").value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)){cnSay("Paste the full web app address that ends in /exec.","bad");return;}
  cnSay("Testing…");
  try{var pg=await cloudGet(url,{action:"ping"});cnSay(pg&&pg.version==="decluta-3"?"The address works and the script is the new version. Now type your admin key and tap Sign in.":"The address works, but the script there is an OLD version. Paste the new Code.gs and deploy a New version.",pg&&pg.version==="decluta-3"?"good":"bad");}
  catch(e){cnSay(e.message+hostHint(),"bad");}
});
$("#cnForm").addEventListener("submit",function(e){e.preventDefault();connectNow($("#cnUrl").value,$("#cnKey").value);});
$("#cnSkip").addEventListener("click",function(){loadLocal();$("#connect").hidden=true;$("#app").hidden=false;render();});
function enter(){
  $("#gate").hidden=true;
  if(SRC==="cloud"){$("#connect").hidden=true;$("#app").hidden=false;render();return;}
  var url=cfgAddress()||(getJSON(CFG)||{}).url||"",key="";
  try{key=sessionStorage.getItem("dng-adm3-key")||localStorage.getItem("dng-adm3-keep")||"";}catch(e){}
  showConnect(url&&key?"Connecting…":"");
  if(url&&key){$("#cnUrl").value=url;connectNow(url,key);}
}
addEyes(document);
enter();
})();
